{
  "name": "TraceHarbor one metadata catalog GET",
  "on": {
    "pull_request": {
      "types": [
        "opened"
      ],
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/traceharbor-metadata.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "metadata": {
      "if": "github.repository == 'Elinfiny/TraceHarbor' && github.event.repository.id == 1391430317 && github.event.repository.private == false && github.event.action == 'opened' && github.event.pull_request.draft == false && github.run_attempt == 1 && github.event.pull_request.base.repo.id == 1391430317 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha == '6ccd91c7660ecdf85753adcd33f99d1d060b6109' && github.event.pull_request.head.repo.id == 1391430317 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'review/traceharbor-v1-metadata-only-20261015'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 2,
      "env": {
        "METADATA_ADMISSION": "ADMITTED_METADATA_ONCE",
        "SOURCE_WORKFLOW_SHA": "${{ github.workflow_sha }}",
        "SOURCE_WORKFLOW_REF": "${{ github.workflow_ref }}"
      },
      "steps": [
        {
          "name": "Admission gate — no credential in this step",
          "shell": "bash",
          "run": "set +x\nif [ \"$METADATA_ADMISSION\" != \"ADMITTED_METADATA_ONCE\" ]; then\n  printf \"%s\\n\" \"CANDIDATE_NOT_ADMITTED\"\n  exit 78\nfi\n"
        },
        {
          "name": "One bounded GET of model metadata only",
          "if": "success() && env.METADATA_ADMISSION == 'ADMITTED_METADATA_ONCE'",
          "shell": "bash",
          "env": {
            "NEBIUS_API_KEY": "${{ secrets.NEBIUS_API_KEY }}"
          },
          "run": "set +x\npython3 - <<'PY'\nimport hashlib\nimport http.client\nimport json\nimport os\nimport re\nimport signal\nimport ssl\nimport time\nfrom datetime import datetime, timezone\nfrom decimal import Decimal, InvalidOperation\n\n# Design source only; this text is embedded in the sole workflow candidate.\nHOST = 'api.tokenfactory.nebius.com'\nTARGET = '/v1/models?verbose=true'\nBASE = '6ccd91c7660ecdf85753adcd33f99d1d060b6109'\nBRANCH = 'review/traceharbor-v1-metadata-only-20261015'\nMAX_BODY = 512 * 1024\nSHA = re.compile(r'^[0-9a-f]{40}$')\nMODEL_ID = re.compile(r'^nvidia/[A-Za-z0-9_.-]{1,160}$')\nPRICE = re.compile(r'^(?:0|[1-9][0-9]{0,9})(?:\\.[0-9]{1,24})?$')\nCAPABILITIES = {'chat', 'completion', 'reasoning', 'tools', 'json', 'vision', 'embeddings'}\nstarted = time.monotonic()\nsource = None\nraw = None\nstatus = None\ncaptured = None\nkey = None\nfailure = None\n\n\nclass Stop(Exception):\n    pass\n\n\ndef pack(value):\n    return json.dumps(value, sort_keys=True, separators=(',', ':'),\n                      ensure_ascii=True, allow_nan=False).encode('utf-8')\n\n\ndef require(condition, code):\n    if not condition:\n        raise Stop(code)\n\n\ndef pairs(items):\n    result = {}\n    for name, value in items:\n        if name in result:\n            raise Stop('SCHEMA_UNEXPECTED')\n        result[name] = value\n    return result\n\n\ndef constant(_):\n    raise Stop('SCHEMA_UNEXPECTED')\n\n\ndef deadline(_signum, _frame):\n    global failure\n    failure = failure or 'METADATA_TIMEOUT_NO_RETRY'\n    raise Stop(failure)\n\n\ndef price(value):\n    # Preserve the provider's string; no unit or USD conversion is inferred.\n    require(isinstance(value, str) and PRICE.fullmatch(value), 'SCHEMA_UNEXPECTED')\n    try:\n        parsed = Decimal(value)\n    except InvalidOperation:\n        raise Stop('SCHEMA_UNEXPECTED') from None\n    require(parsed.is_finite() and parsed >= 0, 'SCHEMA_UNEXPECTED')\n    return value\n\n\ndef publish(state, models=None, error=None):\n    projection = {'schema': 'traceharbor.metadata-only.v1',\n        'state': state, 'source': source,\n        'observed_utc': datetime.now(timezone.utc).isoformat(),\n        'method': 'GET', 'endpoint': 'https://' + HOST + TARGET,\n        'response_capture': captured, 'models': models,\n        'pricing_units': 'UNCONFIRMED_REFERENCE_REQUIRED',\n        'inference_authorized': False, 'error_code': error}\n    wire = pack(projection)\n    # Untrusted metadata never exports a reflected credential.\n    require(len(wire) <= 65536, 'PUBLIC_PROJECTION_TOO_LARGE')\n    require(key is None or (key.encode('ascii') not in wire and\n            json.dumps(key, ensure_ascii=True)[1:-1].encode('ascii') not in wire),\n            'PUBLIC_PROJECTION_REFUSED')\n    envelope = {'projection': projection, 'projection_utf8_bytes': len(wire),\n                'projection_sha256': hashlib.sha256(wire).hexdigest()}\n    # A single bounded JSON line, without workflow command syntax or raw bodies.\n    print(pack(envelope).decode('ascii'), flush=True)\n\n\ntry:\n    # Repeated inside the only step that could receive a secret in a future run.\n    # The preceding no-secret gate fails first in this unarmed candidate.\n    require(os.environ.get('METADATA_ADMISSION') == 'ADMITTED_METADATA_ONCE',\n            'CANDIDATE_NOT_ADMITTED')\n    require(os.environ.get('GITHUB_ACTIONS') == 'true' and\n            os.environ.get('GITHUB_REPOSITORY') == 'Elinfiny/TraceHarbor' and\n            os.environ.get('GITHUB_REPOSITORY_ID') == '1391430317' and\n            os.environ.get('GITHUB_EVENT_NAME') == 'pull_request' and\n            os.environ.get('GITHUB_RUN_ATTEMPT') == '1', 'SOURCE_BINDING_REFUSED')\n    with open(os.environ['GITHUB_EVENT_PATH'], 'rb') as handle:\n        event_raw = handle.read(1048577)\n    require(len(event_raw) <= 1048576, 'SOURCE_BINDING_REFUSED')\n    event = json.loads(event_raw, object_pairs_hook=pairs, parse_constant=constant)\n    pr = event['pull_request']\n    head = pr['head']['sha']\n    merge = os.environ.get('GITHUB_SHA', '')\n    workflow_sha = os.environ.get('SOURCE_WORKFLOW_SHA', '')\n    workflow_ref = os.environ.get('SOURCE_WORKFLOW_REF', '')\n    require(SHA.fullmatch(head) and\n            SHA.fullmatch(merge) and SHA.fullmatch(workflow_sha), 'SOURCE_BINDING_REFUSED')\n    require(event['action'] == 'opened' and event['repository']['id'] == 1391430317 and\n            event['repository']['private'] is False and pr['draft'] is False and\n            pr['head']['repo']['id'] == 1391430317 and\n            pr['head']['repo']['full_name'] == 'Elinfiny/TraceHarbor' and\n            pr['base']['repo']['id'] == 1391430317 and\n            pr['base']['ref'] == 'main' and pr['base']['sha'] == BASE and\n            pr['head']['ref'] == BRANCH and\n            merge == pr['merge_commit_sha'] and workflow_sha == merge,\n            'SOURCE_BINDING_REFUSED')\n    number = event['number']\n    require(type(number) is int and number > 0 and workflow_ref ==\n            'Elinfiny/TraceHarbor/.github/workflows/traceharbor-metadata.yml@refs/pull/' +\n            str(number) + '/merge', 'SOURCE_BINDING_REFUSED')\n    run_id = os.environ.get('GITHUB_RUN_ID', '')\n    job = os.environ.get('GITHUB_JOB', '')\n    require(run_id.isdigit() and 0 < len(run_id) <= 24 and job == 'metadata',\n            'SOURCE_BINDING_REFUSED')\n    source = {'repository': 'Elinfiny/TraceHarbor', 'repository_id': 1391430317,\n        'base_sha': BASE, 'head_sha': head, 'merge_commit_sha': merge,\n        'workflow_sha': workflow_sha, 'workflow_ref': workflow_ref,\n        'branch': BRANCH, 'event': 'pull_request.opened', 'pull_request': number,\n        'run_id': run_id, 'run_attempt': 1, 'job': job,\n        'runner': 'github-hosted ubuntu-24.04 standard',\n        'run_url': 'https://github.com/Elinfiny/TraceHarbor/actions/runs/' + run_id}\n    require(time.monotonic() - started < 100, 'JOB_DEADLINE_NO_RETRY')\n\n    # The only credential access, after admission and source checks. Never logged.\n    key = os.environ.get('NEBIUS_API_KEY')\n    require(isinstance(key, str) and 16 <= len(key) <= 4096 and\n            all(33 <= ord(c) <= 126 for c in key), 'CREDENTIAL_NOT_QUALIFIED')\n    connection = None\n    response = None\n    http_started = time.monotonic()\n    signal.signal(signal.SIGALRM, deadline)\n    signal.setitimer(signal.ITIMER_REAL, 15)\n    try:\n        connection = http.client.HTTPSConnection(HOST, timeout=15,\n                                                 context=ssl.create_default_context())\n        # One fixed GET only; http.client does not follow redirects or auto-retry.\n        connection.request('GET', TARGET, headers={\n            'Authorization': 'Bearer ' + key, 'Accept': 'application/json',\n            'Accept-Encoding': 'identity'})\n        response = connection.getresponse()\n        status = response.status\n        raw = response.read(MAX_BODY + 1)\n    except http.client.IncompleteRead as exc:\n        raw = exc.partial  # Private partial bytes retained; never exported.\n        failure = failure or 'METADATA_INCOMPLETE_NO_RETRY'\n    except Stop as exc:\n        failure = failure or exc.args[0]  # Preserve first constant UNKNOWN.\n    except Exception:\n        failure = failure or 'METADATA_OUTCOME_UNKNOWN_NO_RETRY'\n    finally:\n        # Raw snapshot precedes timer disarm, cleanup and all response guards.\n        try:\n            captured = {'http_status': status,\n                'captured_bytes': len(raw) if raw is not None else None,\n                'sha256': hashlib.sha256(raw).hexdigest() if raw is not None else None,\n                'body_complete': raw is not None and failure is None and len(raw) <= MAX_BODY}\n        finally:\n            signal.setitimer(signal.ITIMER_REAL, 0)\n            if failure is None and status != 200:\n                failure = 'METADATA_NON200_NO_RETRY'\n            if failure is None and time.monotonic() - http_started >= 15:\n                failure = 'METADATA_LATE_NO_RETRY'\n            if failure is None and raw is not None and len(raw) > MAX_BODY:\n                failure = 'METADATA_OVERSIZE_NO_RETRY'\n            try:\n                if connection is not None:\n                    connection.close()\n            except Exception:\n                failure = failure or 'METADATA_CLEANUP_UNKNOWN_NO_RETRY'\n    require(failure is None, failure or 'METADATA_OUTCOME_UNKNOWN_NO_RETRY')\n    require(time.monotonic() - http_started < 15 and\n            time.monotonic() - started < 115, 'METADATA_LATE_NO_RETRY')\n    require(status == 200, 'METADATA_NON200_NO_RETRY')\n    require(raw is not None and len(raw) <= MAX_BODY, 'METADATA_OVERSIZE_NO_RETRY')\n    require(response.getheader('Content-Type', '').split(';')[0].strip().lower() ==\n            'application/json' and response.getheader('Content-Encoding', 'identity') ==\n            'identity', 'SCHEMA_UNEXPECTED')\n    body = json.loads(raw.decode('utf-8'), object_pairs_hook=pairs, parse_constant=constant)\n    require(isinstance(body, dict) and set(body) == {'object', 'data'} and\n            body['object'] == 'list' and isinstance(body['data'], list) and\n            len(body['data']) <= 512, 'SCHEMA_UNEXPECTED')\n    rows = []\n    seen = set()\n    for item in body['data']:\n        require(isinstance(item, dict) and isinstance(item.get('id'), str), 'SCHEMA_UNEXPECTED')\n        identifier = item['id']\n        if not identifier.startswith('nvidia/'):\n            continue\n        require(MODEL_ID.fullmatch(identifier) and identifier not in seen,\n                'SCHEMA_UNEXPECTED')\n        seen.add(identifier)\n        context = item.get('context_length')\n        pricing = item.get('pricing')\n        require(type(context) is int and 0 < context <= 100000000 and\n                isinstance(pricing, dict) and {'prompt', 'completion'} <= set(pricing),\n                'SCHEMA_UNEXPECTED')\n        capabilities = item.get('capabilities')\n        allowed = {k: v for k, v in capabilities.items()\n                   if k in CAPABILITIES and type(v) is bool} if isinstance(capabilities, dict) else {}\n        row = {'id': identifier, 'context_length': context,\n            'pricing': {'prompt': price(pricing['prompt']),\n                        'completion': price(pricing['completion'])},\n            'capabilities_qualification': 'OPTIONAL_UNQUALIFIED',\n            'capabilities_omitted': not isinstance(capabilities, dict) or len(allowed) != len(capabilities)}\n        if allowed:\n            row['capabilities'] = allowed\n        rows.append(row)\n        require(len(rows) <= 64, 'SCHEMA_UNEXPECTED')\n    require(bool(rows), 'NVIDIA_METADATA_NOT_FOUND')\n    require(time.monotonic() - started < 115, 'JOB_DEADLINE_NO_RETRY')\n    publish('RECEIVED_METADATA_ONLY_NOT_INFERENCE_PROOF', rows)\nexcept Stop as exc:\n    if raw is not None and captured is None:\n        captured = {'http_status': status, 'captured_bytes': len(raw),\n            'sha256': hashlib.sha256(raw).hexdigest(), 'body_complete': False}\n    # All Stop arguments originate in constant guards above, never server text.\n    try:\n        publish('STOP_NO_RETRY', error=exc.args[0])\n    except Exception:\n        print('{\"state\":\"STOP_NO_RETRY\",\"error_code\":\"PUBLIC_PROJECTION_REFUSED\"}')\n    raise SystemExit(1) from None\nexcept Exception:\n    try:\n        publish('STOP_NO_RETRY', error='UNEXPECTED_METADATA_FAILURE')\n    except Exception:\n        print('{\"state\":\"STOP_NO_RETRY\",\"error_code\":\"PUBLIC_PROJECTION_REFUSED\"}')\n    raise SystemExit(1) from None\n\nPY\n"
        }
      ]
    }
  }
}
