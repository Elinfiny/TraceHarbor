name: TraceHarbor offline browser QA
on:
  pull_request:
    types: [opened]
    paths:
      - 'qa/**'
      - '.github/workflows/traceharbor-qa.yml'
      - 'web/**'
      - 'fixtures/**'
      - '*.py'
permissions:
  contents: read
jobs:
  browser:
    if: >-
      github.repository == 'Elinfiny/TraceHarbor' &&
      github.event.repository.id == 1391430317 &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/traceharbor-v1-browser-qa-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      QA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      QA_EXPECTED_BASE: b53d48c3088145faed09038069021e1b145883e2
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # official v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install integrity-locked packages without scripts
        working-directory: qa
        run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=0
      - name: Install official Chromium build once
        working-directory: qa
        env:
          DEBUG: pw:install
        run: npx --no-install playwright install --with-deps chromium
      - name: Run synthetic browser QA and emit bounded JSON evidence
        working-directory: qa
        run: npm run qa
      # No artifact upload or cache: storage headroom is unqualified.
      # Evidence is bounded synthetic JSON in standard logs, with SHA-256.
